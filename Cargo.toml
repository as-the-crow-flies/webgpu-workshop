[package]
name = "webgpu-workshop"
version = "0.1.0"
edition = "2021"
description = "A small Rust + WebGPU boilerplate for visualizing your own data."

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
wgpu = "30"
winit = "0.30"
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = { version = "0.36", default-features = false, features = ["links"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
npyz = "0.9"
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.36", features = ["clipboard", "wayland", "x11"] }
env_logger = "0.11"
naga = { version = "30", features = ["wgsl-in"] } # checks shaders when they are hot reloaded
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "Response",
    "UrlSearchParams",
    "Window",
] }

[build-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

# Dependencies are compiled with optimizations even in debug builds, so
# loading data and drawing the UI stay fast while your own code stays debuggable.
[profile.dev.package."*"]
opt-level = 3

# egui-winit 0.36 does not compile for the web (https://github.com/emilk/egui/issues/7052).
# vendor/ holds 0.36.2 with a one-function fix in src/dropped_file.rs. Remove this
# (and vendor/) once a fixed egui-winit is released.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit-0.36.2" }
